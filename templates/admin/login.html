{% extends "base.html" %}
{% block title %}Admin Login — Abinash Catering{% endblock %}
{% block body_class %}page-admin-login{% endblock %}

{% block content %}
<section class="admin-login-wrap">
  <div class="admin-login-card">
    <span class="brand-text center-brand">
      <span class="brand-name">Abinash</span>
      <span class="brand-sub">CATERING · ADMIN</span>
    </span>
    <h1>Admin Login</h1>
    <form method="POST" class="app-form">
      <div class="form-row">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <a href="{{ url_for('home') }}" class="text-link back-to-site">← Back to website</a>
  </div>
</section>
{% endblock %}
